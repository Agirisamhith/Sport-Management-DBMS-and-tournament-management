<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Manage club members — view, add, edit, and delete members."/>
  <title>Members — WoxuDB</title>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"></div>
      <div><span>WoxuDB<small>Management System</small></span></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Overview</div>
      <a href="/" class="nav-item"><span class="nav-icon"></span> Dashboard</a>
      <a href="/reports" class="nav-item"><span class="nav-icon"></span> Reports</a>
      <div class="nav-section-label">Club</div>
      <a href="/members" class="nav-item"><span class="nav-icon"></span> Members</a>
      <a href="/sports" class="nav-item"><span class="nav-icon"></span> Sports</a>
      <a href="/teams" class="nav-item"><span class="nav-icon"></span> Teams</a>
      <a href="/tournaments" class="nav-item"><span class="nav-icon"></span> Tournaments</a>
      <div class="nav-section-label">Resources</div>
      <a href="/equipment" class="nav-item"><span class="nav-icon"></span> Equipment</a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div>
        <div class="topbar-title">Members</div>
        <div class="topbar-subtitle">Manage club members</div>
      </div>
      <button class="btn btn-primary" onclick="openModal('modal-add')">+ Add Member</button>
    </div>

    <div class="page-content">
      <div class="card">
        <div class="card-header">
          <span class="card-title">All Members</span>
          <div class="search-bar" style="width:260px;">
            <span class="search-icon"></span>
            <input type="text" id="search-input" placeholder="Search by name or email…" oninput="handleSearch(this.value)"/>
          </div>
        </div>
        <div class="table-container">
          <table>
            <thead><tr>
              <th>ID</th><th>Name</th><th>Email</th><th>Phone</th>
              <th>DOB</th><th>Joined</th><th>Membership</th><th>Actions</th>
            </tr></thead>
            <tbody id="members-table">
              <tr><td colspan="8" class="loading">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Add Member Modal -->
<div class="modal-overlay" id="modal-add">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Add New Member</span>
      <button class="modal-close" onclick="closeModal('modal-add')">&times;</button>
    </div>
    <div class="modal-body">
      <form id="form-add" onsubmit="submitAdd(event)">
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">First Name *</label>
            <input class="form-control" id="add-fname" required placeholder="Alice"/>
          </div>
          <div class="form-group">
            <label class="form-label">Last Name *</label>
            <input class="form-control" id="add-lname" required placeholder="Johnson"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Email *</label>
          <input class="form-control" id="add-email" type="email" required placeholder="alice@email.com"/>
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input class="form-control" id="add-phone" placeholder="0700-001-001"/>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">Date of Birth *</label>
            <input class="form-control" id="add-dob" type="date" required/>
          </div>
          <div class="form-group">
            <label class="form-label">Join Date</label>
            <input class="form-control" id="add-joindate" type="date"/>
          </div>
        </div>
        <div class="modal-footer" style="padding:0; border:0; margin-top:4px;">
          <button type="button" class="btn btn-outline" onclick="closeModal('modal-add')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Member</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Edit Member Modal -->
<div class="modal-overlay" id="modal-edit">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Edit Member</span>
      <button class="modal-close" onclick="closeModal('modal-edit')">&times;</button>
    </div>
    <div class="modal-body">
      <form id="form-edit" onsubmit="submitEdit(event)">
        <input type="hidden" id="edit-id"/>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">First Name *</label>
            <input class="form-control" id="edit-fname" required/>
          </div>
          <div class="form-group">
            <label class="form-label">Last Name *</label>
            <input class="form-control" id="edit-lname" required/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Email *</label>
          <input class="form-control" id="edit-email" type="email" required/>
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input class="form-control" id="edit-phone"/>
        </div>
        <div class="modal-footer" style="padding:0; border:0; margin-top:4px;">
          <button type="button" class="btn btn-outline" onclick="closeModal('modal-edit')">Cancel</button>
          <button type="submit" class="btn btn-primary">Update</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/static/main.js"></script>
<script>
let allMembers = [];

async function loadMembers(search = '') {
  try {
    const url = search ? `/members/?search=${encodeURIComponent(search)}` : '/members/';
    allMembers = await apiGet(url);
    renderTable(allMembers);
  } catch (e) {
    showToast('Error loading members: ' + e.message, 'error');
  }
}

function renderTable(members) {
  const tbody = document.getElementById('members-table');
  if (!members.length) {
    tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="empty-icon"></div><p>No members found</p></div></td></tr>';
    return;
  }
  tbody.innerHTML = members.map(m => `
    <tr>
      <td class="text-muted">#${m.member_id}</td>
      <td><span class="font-bold">${m.first_name} ${m.last_name}</span></td>
      <td>${m.email}</td>
      <td>${m.phone || '—'}</td>
      <td>${formatDate(m.date_of_birth)}</td>
      <td>${formatDate(m.join_date)}</td>
      <td>${m.membership_status ? statusBadge(m.membership_status) : '<span class="badge badge-muted">None</span>'}</td>
      <td>
        <div class="flex gap-2">
          <button class="btn btn-outline btn-sm" onclick="openEdit(${m.member_id})">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteMember(${m.member_id})">Delete</button>
        </div>
      </td>
    </tr>`).join('');
}

let searchTimeout;
function handleSearch(value) {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => loadMembers(value), 350);
}

async function submitAdd(e) {
  e.preventDefault();
  try {
    await apiPost('/members/', {
      first_name:    document.getElementById('add-fname').value,
      last_name:     document.getElementById('add-lname').value,
      email:         document.getElementById('add-email').value,
      phone:         document.getElementById('add-phone').value || null,
      date_of_birth: document.getElementById('add-dob').value,
      join_date:     document.getElementById('add-joindate').value || null,
    });
    closeModal('modal-add');
    document.getElementById('form-add').reset();
    showToast('Member added successfully!', 'success');
    loadMembers();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

async function openEdit(id) {
  const m = allMembers.find(x => x.member_id === id);
  if (!m) return;
  document.getElementById('edit-id').value    = id;
  document.getElementById('edit-fname').value = m.first_name;
  document.getElementById('edit-lname').value = m.last_name;
  document.getElementById('edit-email').value = m.email;
  document.getElementById('edit-phone').value = m.phone || '';
  openModal('modal-edit');
}

async function submitEdit(e) {
  e.preventDefault();
  const id = document.getElementById('edit-id').value;
  try {
    await apiPut(`/members/${id}`, {
      first_name: document.getElementById('edit-fname').value,
      last_name:  document.getElementById('edit-lname').value,
      email:      document.getElementById('edit-email').value,
      phone:      document.getElementById('edit-phone').value || null,
    });
    closeModal('modal-edit');
    showToast('Member updated!', 'success');
    loadMembers();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

async function deleteMember(id) {
  if (!confirm('Are you sure you want to delete this member?')) return;
  try {
    await apiDelete(`/members/${id}`);
    showToast('Member deleted.', 'warning');
    loadMembers();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

loadMembers();
</script>
</body>
</html>
